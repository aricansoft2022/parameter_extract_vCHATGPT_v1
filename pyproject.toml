[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-extract"
version = "0.1.0"
description = "Deterministic research engine for ccbot-compatible crypto strategy parameters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pextract = "parameter_extract.cli:main"
pextract-deploy = "parameter_extract.deploy_cli:main"
pextract-fast-search = "parameter_extract.prepared_cli:main"
pextract-indexed-search = "parameter_extract.indexed_cli:main"
pextract-cached-search = "parameter_extract.cached_cli:main"
pextract-query-search = "parameter_extract.query_cli:main"
pextract-bulk-search = "parameter_extract.bulk_cli:main"
pextract-scale = "parameter_extract.scale_cli:main"
pextract-bundle = "parameter_extract.bundle_cli:main"
pextract-freeze-diverse = "parameter_extract.diverse_freeze:main"
pextract-freeze-diverse-filtered = "parameter_extract.filtered_diverse_freeze:main"
pextract-migrate-paramderive = "parameter_extract.legacy_data_cli_compat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
