[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-extract"
version = "0.1.0"
description = "Deterministic research engine for ccbot-compatible crypto strategy parameters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pextract = "parameter_extract.cli:main"
pextract-deploy = "parameter_extract.deploy_cli:main"
pextract-fast-search = "parameter_extract.prepared_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
